<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Test</title>
</head>
<body>
  <h2>Test Upload Image</h2>

  <input 
    type="file" 
    id="fileInput" 
    accept="image/*"
  />

  <br/><br/>

  <img id="preview" style="max-width: 100%; height: auto; display: none;" />

  <p id="status" style="font-weight: bold; color: blue;"></p>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const statusText = document.getElementById('status');

    // Hàm helper để gửi message nếu đang chạy trong WebView
    function sendToApp(data) {
      if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function') {
        window.ReactNativeWebView.postMessage(JSON.stringify(data));
      } else {
        console.log('[DEBUG] Not in WebView:', data);
      }
    }

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        // ✅ Cập nhật text
        statusText.textContent = '📸 Upload thành công!';
        statusText.style.color = 'green';

        // ✅ Gửi message về app
        sendToApp({ type: 'pickerClosed', action: 'upload' });
      } else {
        // ✅ Khi người dùng cancel
        preview.style.display = 'none';
        statusText.textContent = '❌ Đã hủy chọn ảnh';
        statusText.style.color = 'red';

        // ✅ Gửi message về app
        sendToApp({ type: 'pickerClosed', action: 'cancel' });
      }
    });

    // Log sự kiện mở picker
    fileInput.addEventListener('click', () => {
      statusText.textContent = '🟡 Đang mở Gallery...';
      statusText.style.color = 'orange';
      sendToApp({ type: 'pickerOpened' });
    });
  </script>
</body>
</html>
