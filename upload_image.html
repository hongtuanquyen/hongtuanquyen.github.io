<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Test</title>
</head>
<body>
  <h2>Test Upload Image</h2>

  <input 
    type="file" 
    id="fileInput" 
    accept="image/*"
  />

  <br/><br/>
  <img id="preview" style="max-width: 100%; height: auto; display: none;" />
  <p id="status" style="font-weight: bold; color: blue;"></p>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const statusText = document.getElementById('status');
    let pickerOpened = false;

    function sendToApp(data) {
      if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function') {
        window.ReactNativeWebView.postMessage(JSON.stringify(data));
      } else {
        console.log('[DEBUG] Not in WebView:', data);
      }
    }

    // Khi người dùng tap vào nút Upload
    fileInput.addEventListener('click', () => {
      pickerOpened = true;
      statusText.textContent = '🟡 Đang mở Gallery...';
      statusText.style.color = 'orange';
      sendToApp({ type: 'pickerOpened' });
    });

    // Khi chọn ảnh thành công
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      pickerOpened = false;

      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        statusText.textContent = '📸 Upload thành công!';
        statusText.style.color = 'green';
        sendToApp({ type: 'pickerClosed', action: 'upload' });
      }
    });

    // Dò khi picker bị đóng mà không chọn ảnh
    window.addEventListener('focus', () => {
      if (pickerOpened) {
        setTimeout(() => {
          if (!fileInput.files.length) {
            statusText.textContent = '❌ Đã hủy chọn ảnh';
            statusText.style.color = 'red';
            sendToApp({ type: 'pickerClosed', action: 'cancel' });
          }
          pickerOpened = false;
        }, 500);
      }
    });
  </script>
</body>
</html>
