<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Test</title>
</head>
<body>
  <h2>Test Upload Image</h2>
  <button id="uploadBtn">📸 Chọn ảnh</button>

  <br/><br/>
  <img id="preview" style="max-width: 100%; height: auto; display: none;" />
  <p id="status" style="font-weight: bold; color: blue;"></p>

  <script>
    const uploadBtn = document.getElementById("uploadBtn");
    const preview = document.getElementById("preview");
    const statusText = document.getElementById("status");

    // Gửi message cho app React Native
    function sendToApp(data) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(data));
      } else {
        console.log("[DEBUG] Not in WebView:", data);
      }
    }

    // Khi nhấn nút upload
    uploadBtn.addEventListener("click", () => {
      statusText.textContent = "🟡 Đang mở picker...";
      statusText.style.color = "orange";
      sendToApp({ type: "openPicker" });
    });

    // Nhận message từ React Native
    window.addEventListener("message", (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === "pickerClosed") {
          if (data.action === "upload" && data.image) {
            statusText.textContent = "✅ Upload thành công!";
            statusText.style.color = "green";
            preview.src = data.image;
            preview.style.display = "block";
          } else if (data.action === "cancel") {
            statusText.textContent = "❌ Đã hủy chọn ảnh";
            statusText.style.color = "red";
            preview.style.display = "none";
          }
        }
      } catch (e) {
        console.log("Invalid message", e);
      }
    });
  </script>
</body>
</html>
